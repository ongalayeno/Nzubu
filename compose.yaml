services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nzubu
      POSTGRES_USER: nzubu
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "127.0.0.1:56321:5432"
    volumes:
      - nzubu_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nzubu -d nzubu"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  nzubu_pg_data:
